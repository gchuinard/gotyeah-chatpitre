# Environnement de PRODUCTION (Raspberry Pi) : PostgreSQL + l'app Next en
# image `runner` (build standalone Next, utilisateur non-root).
#
# L'app n'est PAS publiée sur l'hôte : elle n'est joignable que par Nginx
# Proxy Manager, via le réseau Docker partagé `nginx-proxy-manager_default`.
# NPM est l'unique point d'entrée et termine le TLS (Let's Encrypt) ;
# Cloudflare est devant NPM. La base n'est exposée ni à l'hôte ni au LAN.
#
# Déploiement :  docker compose -f docker-compose.prod.yml up -d --build
# Prérequis   :  un .env de production (AUTH_SECRET dédié, BASE_URL https…),
#                avec POSTGRES_USER, POSTGRES_PASSWORD et POSTGRES_DB. Compose les lit
#                dans le .env à côté de ce fichier ; s'il en manque un, il refuse de
#                démarrer au lieu de lancer la base avec une valeur vide.
#                Mot de passe alphanumérique : il est repris tel quel dans DATABASE_URL.

services:
  db:
    # Limite posee le 28/08/2026, sur trois fois la consommation observee.
    # Elle etait deja appliquee a chaud par docker update ; elle est ecrite ici
    # pour survivre a une recreation du conteneur.
    mem_limit: 128m
    image: postgres:16-alpine
    container_name: chatpitre_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant dans .env}
    volumes:
      - chatpitre_pgdata:/var/lib/postgresql/data
    # Pas de `ports:` — la base reste interne au réseau `default`,
    # seule l'app y accède.
    healthcheck:
      # $$ : la variable est lue dans le conteneur, pas remplacée par Compose.
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 3s
      retries: 10

  app:
    # Limite posee le 28/08/2026, sur trois fois la consommation observee.
    # Elle etait deja appliquee a chaud par docker update ; elle est ecrite ici
    # pour survivre a une recreation du conteneur.
    mem_limit: 384m
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: chatpitre-app:latest
    container_name: chatpitre_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Dans le réseau Docker, la base est joignable via le nom de service `db`
      # — on surcharge le DATABASE_URL du .env (qui pointe sur localhost).
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_ENV: production
      # Répertoire des documents téléversés (monté sur le volume ci-dessous).
      UPLOAD_DIR: /data/uploads
    # Documents téléversés — volume persistant (survit aux `up -d --build`).
    volumes:
      - chatpitre_uploads:/data/uploads
    # `expose` (et non `ports`) : 3000 n'est ouvert qu'aux conteneurs des
    # réseaux rejoints, jamais à l'hôte. NPM atteint l'app par son nom.
    expose:
      - "3000"
    networks:
      - default
      - npm
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  # Réutilise le volume de données existant (préfixé par le nom de projet
  # `gotyeah-chatpitre`) — aucune perte de données au passage dev → prod.
  chatpitre_pgdata:
  # Documents téléversés des chats (carnets de vaccination, certificats…).
  chatpitre_uploads:

networks:
  # Réseau interne app ↔ db, créé automatiquement par Compose.
  default:
  # Réseau partagé avec Nginx Proxy Manager. Sur ce Pi il s'appelle
  # `nginx-proxy-manager_default` (cf. `docker network ls | grep nginx`).
  # C'est ce réseau qui permet à NPM de résoudre le nom `chatpitre_app`.
  npm:
    external: true
    name: nginx-proxy-manager_default
